name: Backport to Develop

on:
  push:
    branches:
      - main

jobs:
  backport:
    name: Create backport PR to develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create backport branch
        run: |
          BRANCH_NAME="backport/main-to-develop-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          git fetch origin develop
          git checkout -b $BRANCH_NAME origin/main

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          base: develop
          title: "chore: backport main to develop"
          body: |
            Automatic backport PR from `main` to `develop`.

            This PR syncs the latest changes from `main` back to `develop`.

            **Triggered by:** ${{ github.event.head_commit.message }}

            ---
            *This PR was created automatically by the backport workflow.*
          labels: backport, automated
          delete-branch: true